<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Concept 1B: Pure High-Contrast Clash (Perfect black/white silhouette) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Back Card (Left) with thick crisp border -->
    <rect x="42" y="56" width="96" height="142" rx="16" fill="#18181B" stroke="#6366F1" stroke-width="14" transform="rotate(-15 90 127)"/>
    <!-- Front Card (Right) -->
    <rect x="118" y="56" width="96" height="142" rx="16" fill="#6366F1" stroke="#FFFFFF" stroke-width="14" transform="rotate(15 166 127)"/>
    <!-- Inner emblem lines on front card representing ranking ladder -->
    <line x1="140" y1="105" x2="182" y2="105" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" transform="rotate(15 166 127)"/>
    <line x1="140" y1="127" x2="192" y2="127" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" transform="rotate(15 166 127)"/>
    <line x1="140" y1="149" x2="172" y2="149" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" transform="rotate(15 166 127)"/>
  </g>
</svg>
