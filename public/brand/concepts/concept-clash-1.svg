<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Concept 1A: Two Solid Contender Cards Clashing (Crisp geometry, 100% scalable to 16px) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Card Left (Tilted -14deg, Indigo) -->
    <rect x="36" y="52" width="94" height="144" rx="14" fill="#4F46E5" stroke="#FFFFFF" stroke-width="12" transform="rotate(-14 83 124)" />
    <!-- Card Right (Tilted +14deg, Fuchsia, Overlapping) -->
    <rect x="126" y="52" width="94" height="144" rx="14" fill="#DB2777" stroke="#FFFFFF" stroke-width="12" transform="rotate(14 173 124)" />
    <!-- Dynamic Duel Slash (Cut/Spark at intersection) -->
    <path d="M128 72 L128 176" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <circle cx="128" cy="124" r="14" fill="#FFFFFF"/>
  </g>
</svg>
