<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Concept A: Duel 2 (Two overlapping tilted match cards forming numeral 2) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Card Left (Contender 1) -->
    <rect x="36" y="52" width="92" height="136" rx="14" fill="#6366F1" fill-opacity="0.2" stroke="#6366F1" stroke-width="14" transform="rotate(-12 82 120)" />
    <!-- Card Right (Contender 2) -->
    <rect x="128" y="52" width="92" height="136" rx="14" fill="#EC4899" fill-opacity="0.2" stroke="#EC4899" stroke-width="14" transform="rotate(12 174 120)" />
    <!-- Dynamic Clash Spark / 2 Emblem Center -->
    <path d="M96 88 C96 64, 160 64, 160 100 C160 132, 100 148, 92 176 L168 176" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
