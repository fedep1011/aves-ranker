<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rankea2 — ¿Qué ranking preferís hoy?</title>
  <meta name="description" content="Torneos 1 vs 1 para armar tu ranking de favoritos: Aves, Pokémon, Flores y Mamíferos." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/tailwind.css" />
  <script>
    (function () {
      const saved = localStorage.getItem('rankea2_theme');
      if (saved === 'dark') {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <style>
    :root {
      --hub-bg: #F4F3EF;
      --hub-surface: #FFFFFF;
      --hub-ink: #161615;
      --hub-muted: #6E6D68;
      --hub-line: #E2DFD7;
    }
    html.dark {
      --hub-bg: #141413;
      --hub-surface: #1C1C1A;
      --hub-ink: #F3F2EE;
      --hub-muted: #9A9890;
      --hub-line: #2A2A26;
    }
    body {
      background-color: var(--hub-bg);
      color: var(--hub-ink);
      font-family: 'Inter', system-ui, sans-serif;
      transition: background-color 0.18s ease, color 0.18s ease;
      -webkit-font-smoothing: antialiased;
    }
    .hub-header {
      background-color: color-mix(in srgb, var(--hub-bg) 92%, transparent);
      border-bottom: 1px solid var(--hub-line);
    }
    .hub-surface {
      background-color: var(--hub-surface);
      border-color: var(--hub-line);
    }
    .hub-muted {
      color: var(--hub-muted);
    }
    .font-aves {
      font-family: 'Instrument Serif', Georgia, serif;
    }
    .font-poke {
      font-family: 'Space Grotesk', system-ui, sans-serif;
    }
    .font-flora {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    /* Card 1: Aves (Editorial Natural) */
    .arena-aves {
      background-color: #F8F7F3;
      border: 1.5px solid #1D3B2A;
      color: #161816;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    html.dark .arena-aves {
      background-color: #131A15;
      border-color: #2D5A3F;
      color: #EDF3EE;
    }
    .arena-aves:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px -8px rgba(29, 59, 42, 0.22);
    }

    /* Card 2: Pokémon (Arcade Brutalist) */
    .arena-poke {
      background-color: #FFF9E0;
      color: #111111;
      border: 2px solid #111111;
      box-shadow: 3px 3px 0px #111111;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    html.dark .arena-poke {
      background-color: #1F1D16;
      border-color: #FFDE59;
      color: #F8F7F3;
      box-shadow: 3px 3px 0px #FFDE59;
    }
    .arena-poke:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #111111;
    }
    html.dark .arena-poke:hover {
      box-shadow: 4px 4px 0px #FFDE59;
    }

    /* Card 3: Flores y Plantas (Botanical Delicate) */
    .arena-flora {
      background-color: #F3F1EC;
      color: #283129;
      border: 1px solid #BAC7BA;
      transition: transform 0.18s ease;
    }
    html.dark .arena-flora {
      background-color: #151A16;
      border-color: #2F3B31;
      color: #E2ECE3;
    }
    .arena-flora:hover {
      transform: translateY(-2px);
    }

    /* Card 4: Mamíferos y Felinos (Wild Earth) */
    .arena-fauna {
      background-color: #F5EFE8;
      color: #26211C;
      border: 1px solid #8C6239;
      transition: transform 0.18s ease;
    }
    html.dark .arena-fauna {
      background-color: #1A1714;
      border-color: #8C6239;
      color: #F2EAE0;
    }
    .arena-fauna:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="min-h-[100dvh] flex flex-col">

  <!-- COMPACT HEADER -->
  <header class="hub-header sticky top-0 z-30 backdrop-blur-sm">
    <div class="max-w-4xl mx-auto px-4 h-12 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 focus:outline-none">
        <svg class="w-6 h-6" viewBox="0 0 256 256" aria-hidden="true">
          <path fill="currentColor" opacity="0.4" d="M32 48 A16 16 0 0 1 48 32 H128 A16 16 0 0 1 144 48 V64 H104 A32 32 0 0 0 72 96 V192 H48 A16 16 0 0 1 32 176 V48 Z"/>
          <path fill="currentColor" fill-rule="evenodd" d="M104 80 H208 A16 16 0 0 1 224 96 V208 A16 16 0 0 1 208 224 H104 A16 16 0 0 1 88 208 V96 A16 16 0 0 1 104 80 Z M120 176 H192 V136 L172 152 L156 124 L140 152 L120 136 V176 Z"/>
        </svg>
        <span class="font-poke font-extrabold text-lg tracking-tight">Rankea2</span>
      </a>

      <button id="themeToggle" type="button" aria-label="Cambiar tema"
        class="hub-surface border px-2.5 py-1 rounded-full text-xs font-medium flex items-center gap-1.5 transition hover:opacity-80">
        <span id="themeIcon">◐</span>
        <span id="themeLabel">Oscuro</span>
      </button>
    </div>
  </header>

  <!-- MAIN WITH COMPACT DENSITY -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-5 sm:py-7 space-y-5 sm:space-y-6">

    <!-- COMPACT HOOK: ¿Qué ranking preferís hoy? -->
    <section class="hub-surface border rounded-xl p-3 sm:p-4">
      <div class="flex items-center justify-between gap-2 mb-2.5">
        <h1 class="text-xs sm:text-sm font-semibold tracking-tight uppercase hub-muted">
          ¿Qué ranking preferís hoy?
        </h1>
        <button id="shuffleMatchupBtn" type="button"
          class="text-[11px] hub-muted hover:opacity-80 px-2 py-0.5 rounded-full border border-current/15 transition">
          Otro cruce ↻
        </button>
      </div>

      <div id="quickDuelContainer" class="grid grid-cols-1 sm:grid-cols-[1fr_auto_1fr] items-stretch gap-2">
        <!-- Populated by JS -->
      </div>
    </section>

    <!-- 2-COLUMN BALANCED GRID -->
    <section class="grid grid-cols-1 sm:grid-cols-2 gap-4">

      <!-- 1. AVES DEL MUNDO (Active — Editorial Natural) -->
      <a href="/aves/" class="arena-aves rounded-xl p-3 sm:p-4 flex flex-col justify-between group">
        <!-- Complete Facing Photos (Not cropped) -->
        <div class="grid grid-cols-2 gap-2 h-28 sm:h-32 mb-3">
          <div class="relative rounded-lg overflow-hidden bg-black/10">
            <img src="https://inaturalist-open-data.s3.amazonaws.com/photos/63281117/medium.jpg"
                 alt="Tucán Toco"
                 class="w-full h-full object-cover object-center group-hover:scale-105 transition duration-300" />
          </div>
          <div class="relative rounded-lg overflow-hidden bg-black/10">
            <img src="https://static.inaturalist.org/photos/67503679/medium.jpg"
                 alt="Guacamayo Rojo"
                 class="w-full h-full object-cover object-center group-hover:scale-105 transition duration-300" />
          </div>
        </div>

        <div class="flex items-center justify-between pt-1">
          <h2 class="font-aves text-2xl sm:text-3xl leading-none">
            Aves del Mundo
          </h2>
          <span class="w-7 h-7 rounded-full bg-[#1D3B2A] text-white flex items-center justify-center text-xs font-medium group-hover:translate-x-0.5 transition shrink-0">
            →
          </span>
        </div>
      </a>

      <!-- 2. POKÉMON (Upcoming — Arcade Brutalist) -->
      <div id="card-pokemon" class="arena-poke rounded-xl p-3 sm:p-4 flex flex-col justify-between select-none">
        <!-- Complete Facing Sprites -->
        <div class="grid grid-cols-2 gap-2 h-28 sm:h-32 mb-3">
          <div class="rounded-lg bg-[#EF4444]/15 border border-[#EF4444]/30 flex items-center justify-center p-1">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png"
                 alt="Charizard"
                 class="w-full h-full object-contain" />
          </div>
          <div class="rounded-lg bg-[#3B82F6]/15 border border-[#3B82F6]/30 flex items-center justify-center p-1">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/9.png"
                 alt="Blastoise"
                 class="w-full h-full object-contain" />
          </div>
        </div>

        <div class="flex items-center justify-between pt-1">
          <h2 class="font-poke font-extrabold text-xl sm:text-2xl uppercase tracking-tight leading-none">
            Pokémon
          </h2>
          <span class="px-2 py-0.5 rounded bg-[#111111] text-[#FFDE59] dark:bg-[#FFDE59] dark:text-[#111111] font-poke text-[10px] font-bold uppercase tracking-wider">
            Pronto
          </span>
        </div>
      </div>

      <!-- 3. FLORES Y PLANTAS (Upcoming — Botanical Delicate) -->
      <div id="card-flores" class="arena-flora rounded-xl p-3 sm:p-4 flex flex-col justify-between select-none">
        <!-- Complete Facing Photos -->
        <div class="grid grid-cols-2 gap-2 h-28 sm:h-32 mb-3">
          <div class="rounded-lg overflow-hidden bg-black/5">
            <img src="https://inaturalist-open-data.s3.amazonaws.com/photos/40082393/medium.jpg"
                 alt="Mburucuyá"
                 class="w-full h-full object-cover object-center" />
          </div>
          <div class="rounded-lg overflow-hidden bg-black/5">
            <img src="https://inaturalist-open-data.s3.amazonaws.com/photos/127799924/medium.jpg"
                 alt="Orquídea"
                 class="w-full h-full object-cover object-center" />
          </div>
        </div>

        <div class="flex items-center justify-between pt-1">
          <h2 class="font-flora italic font-semibold text-2xl sm:text-3xl leading-none">
            Flores y Plantas
          </h2>
          <span class="px-2 py-0.5 rounded-full bg-black/5 dark:bg-white/10 text-[10px] font-medium">
            Pronto
          </span>
        </div>
      </div>

      <!-- 4. MAMÍFEROS Y FELINOS (Upcoming — Wild Earth) -->
      <div id="card-mamiferos" class="arena-fauna rounded-xl p-3 sm:p-4 flex flex-col justify-between select-none">
        <!-- Complete Facing Photos -->
        <div class="grid grid-cols-2 gap-2 h-28 sm:h-32 mb-3">
          <div class="rounded-lg overflow-hidden bg-black/20">
            <img src="https://static.inaturalist.org/photos/51015966/medium.jpg"
                 alt="Yaguareté"
                 class="w-full h-full object-cover object-center" />
          </div>
          <div class="rounded-lg overflow-hidden bg-black/20">
            <img src="https://inaturalist-open-data.s3.amazonaws.com/photos/43633891/medium.jpg"
                 alt="Tigre"
                 class="w-full h-full object-cover object-center" />
          </div>
        </div>

        <div class="flex items-center justify-between pt-1">
          <h2 class="font-aves text-2xl sm:text-3xl leading-none tracking-wide">
            Mamíferos y Felinos
          </h2>
          <span class="px-2 py-0.5 rounded-full bg-black/5 dark:bg-white/10 text-[10px] font-medium">
            Pronto
          </span>
        </div>
      </div>

    </section>

  </main>

  <script>
    // Theme toggle
    const themeToggle = document.getElementById('themeToggle');
    const themeLabel = document.getElementById('themeLabel');

    function syncThemeUI() {
      const isDark = document.documentElement.classList.contains('dark');
      themeLabel.textContent = isDark ? 'Claro' : 'Oscuro';
    }
    syncThemeUI();

    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('rankea2_theme', isDark ? 'dark' : 'light');
      syncThemeUI();
    });

    // Quick non-invasive category duel selector ("¿Qué ranking preferís hoy?")
    const ARENAS = [
      {
        id: 'aves',
        title: 'Aves del Mundo',
        href: '/aves/',
        active: true,
        thumb: 'https://inaturalist-open-data.s3.amazonaws.com/photos/63281117/medium.jpg',
        fontClass: 'font-aves text-xl sm:text-2xl'
      },
      {
        id: 'pokemon',
        title: 'Pokémon',
        href: '#card-pokemon',
        active: false,
        thumb: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png',
        fontClass: 'font-poke font-extrabold text-base sm:text-lg uppercase'
      },
      {
        id: 'flores',
        title: 'Flores y Plantas',
        href: '#card-flores',
        active: false,
        thumb: 'https://inaturalist-open-data.s3.amazonaws.com/photos/40082393/medium.jpg',
        fontClass: 'font-flora italic font-semibold text-xl sm:text-2xl'
      },
      {
        id: 'mamiferos',
        title: 'Mamíferos y Felinos',
        href: '#card-mamiferos',
        active: false,
        thumb: 'https://static.inaturalist.org/photos/51015966/medium.jpg',
        fontClass: 'font-aves text-xl sm:text-2xl'
      }
    ];

    let pairIdx = 0;
    const PAIRS = [
      [0, 1],
      [0, 3],
      [0, 2],
      [1, 3]
    ];

    function renderQuickDuel() {
      const [iA, iB] = PAIRS[pairIdx % PAIRS.length];
      const a = ARENAS[iA];
      const b = ARENAS[iB];
      const box = document.getElementById('quickDuelContainer');

      const renderChoice = (item) => `
        <a href="${item.href}"
           class="hub-surface border flex items-center justify-between gap-2.5 px-3 py-2 rounded-lg transition hover:opacity-85">
          <div class="flex items-center gap-2.5 min-w-0">
            <img src="${item.thumb}" alt="${item.title}" class="w-8 h-8 rounded-md object-cover bg-black/5 shrink-0" />
            <span class="${item.fontClass} truncate leading-none">${item.title}</span>
          </div>
          <span class="text-[11px] font-medium shrink-0 hub-muted">${item.active ? 'Jugar →' : 'Pronto'}</span>
        </a>
      `;

      box.innerHTML = `
        ${renderChoice(a)}
        <div class="flex items-center justify-center text-[10px] font-bold hub-muted px-1">VS</div>
        ${renderChoice(b)}
      `;
    }

    document.getElementById('shuffleMatchupBtn').addEventListener('click', () => {
      pairIdx++;
      renderQuickDuel();
    });

    renderQuickDuel();
  </script>

</body>
</html>
