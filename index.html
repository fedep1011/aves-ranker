<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rankea2 · Torneos y rankings 1 vs 1</title>
  <meta name="description" content="Torneos 1 vs 1 para armar tu ranking de favoritos: Aves, Pokémon, Flores y Mamíferos." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/tailwind.css" />
  <script>
    (function () {
      const saved = localStorage.getItem('rankea2_theme');
      if (saved === 'dark') {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <style>
    :root {
      --hub-bg: #F3F2EE;
      --hub-surface: #FAF9F6;
      --hub-ink: #161615;
      --hub-muted: #6E6D68;
      --hub-line: #E2DFD7;
    }
    html.dark {
      --hub-bg: #141413;
      --hub-surface: #1E1E1C;
      --hub-ink: #F3F2EE;
      --hub-muted: #9A9890;
      --hub-line: #2C2C29;
    }
    body {
      background-color: var(--hub-bg) !important;
      color: var(--hub-ink) !important;
      font-family: 'Inter', system-ui, sans-serif;
      transition: background-color 0.18s ease, color 0.18s ease;
      -webkit-font-smoothing: antialiased;
    }
    .hub-header {
      background-color: color-mix(in srgb, var(--hub-bg) 92%, transparent);
      border-bottom: 1px solid var(--hub-line);
    }
    .hub-surface {
      background-color: var(--hub-surface);
      border-color: var(--hub-line);
    }
    .hub-muted {
      color: var(--hub-muted);
    }
    .font-aves {
      font-family: 'Instrument Serif', Georgia, serif;
    }
    .font-poke {
      font-family: 'Space Grotesk', system-ui, sans-serif;
    }
    .font-flora {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    .half-split-left {
      position: absolute;
      inset-block: 0;
      left: 0;
      width: 55%;
      clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%);
      overflow: hidden;
    }
    .half-split-right {
      position: absolute;
      inset-block: 0;
      right: 0;
      width: 55%;
      clip-path: polygon(20% 0, 100% 0, 100% 100%, 0 100%);
      overflow: hidden;
    }

    .arena-aves {
      background-color: #F6F4EF;
      color: #161816;
      border: 2px solid #1D3B2A;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
    }
    html.dark .arena-aves {
      background-color: #151C17;
      border-color: #2D5A3F;
      color: #EDF3EE;
    }
    .arena-aves:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 28px -10px rgba(29, 59, 42, 0.28);
    }
    html.dark .arena-aves:hover {
      box-shadow: 0 14px 28px -10px rgba(0, 0, 0, 0.5);
    }

    .arena-poke {
      background-color: #FFDE59;
      color: #111111;
      border: 3px solid #111111;
      box-shadow: 5px 5px 0px #111111;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    html.dark .arena-poke {
      background-color: #1F1D16;
      color: #F8F7F3;
      border-color: #FFDE59;
      box-shadow: 5px 5px 0px #FFDE59;
    }
    .arena-poke:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0px #111111;
    }
    html.dark .arena-poke:hover {
      box-shadow: 7px 7px 0px #FFDE59;
    }

    .arena-flora {
      background-color: #EFECE6;
      color: #2B332C;
      border: 1.5px solid #B7C4B8;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    html.dark .arena-flora {
      background-color: #151A16;
      color: #E2ECE3;
      border-color: #38473A;
    }
    .arena-flora:hover {
      transform: translateY(-2px);
    }

    .arena-fauna {
      background-color: #1E1B18;
      color: #F5EFE6;
      border: 2px solid #8C6239;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    html.dark .arena-fauna {
      background-color: #1A1714;
      border-color: #A67848;
      color: #F5EFE6;
    }
    .arena-fauna:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="min-h-[100dvh] flex flex-col">

  <header class="hub-header sticky top-0 z-30 backdrop-blur-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-8 h-14 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5 focus:outline-none">
        <svg class="w-7 h-7" viewBox="0 0 256 256" aria-hidden="true">
          <path fill="currentColor" opacity="0.45" d="M32 48 A16 16 0 0 1 48 32 H128 A16 16 0 0 1 144 48 V64 H104 A32 32 0 0 0 72 96 V192 H48 A16 16 0 0 1 32 176 V48 Z"/>
          <path fill="currentColor" fill-rule="evenodd" d="M104 80 H208 A16 16 0 0 1 224 96 V208 A16 16 0 0 1 208 224 H104 A16 16 0 0 1 88 208 V96 A16 16 0 0 1 104 80 Z M120 176 H192 V136 L172 152 L156 124 L140 152 L120 136 V176 Z"/>
        </svg>
        <span class="font-poke font-extrabold text-xl tracking-tight">Rankea2</span>
      </a>

      <button id="themeToggle" type="button" aria-label="Cambiar tema"
        class="hub-surface border px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-1.5 transition hover:opacity-80">
        <svg id="themeIconDark" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
        <svg id="themeIconLight" class="w-3.5 h-3.5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <span id="themeLabel">Oscuro</span>
      </button>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-8 py-6 sm:py-8 space-y-6 sm:space-y-8">

    <section class="hub-surface border rounded-2xl p-4 sm:p-5">
      <div class="flex items-center justify-between gap-2 mb-3">
        <h1 class="text-base sm:text-lg font-semibold tracking-tight">
          ¿Qué ranking preferís hoy?
        </h1>
        <button id="shuffleMatchupBtn" type="button"
          class="text-xs hub-muted hover:opacity-80 px-2.5 py-1 rounded-full border border-current/20 transition flex items-center gap-1.5">
          <span>Otro cruce</span>
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>
          </svg>
        </button>
      </div>

      <div id="quickDuelContainer" class="grid grid-cols-1 sm:grid-cols-[1fr_auto_1fr] items-stretch gap-2.5 sm:gap-3">
      </div>
    </section>

    <section class="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6">

      <a href="/aves/" class="arena-aves rounded-2xl overflow-hidden flex flex-col group">
        <div class="relative h-44 sm:h-52 w-full bg-[#1C241E] overflow-hidden">
          <div class="half-split-left">
            <img src="https://inaturalist-open-data.s3.amazonaws.com/photos/63281117/medium.jpg"
                 alt="Tucán Toco"
                 class="w-full h-full object-cover object-center group-hover:scale-105 transition duration-500" />
          </div>
          <div class="half-split-right">
            <img src="https://static.inaturalist.org/photos/67503679/medium.jpg"
                 alt="Guacamayo Rojo"
                 class="w-full h-full object-cover object-center group-hover:scale-105 transition duration-500" />
          </div>
          <svg class="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="none" viewBox="0 0 100 100">
            <line x1="55" y1="0" x2="44" y2="100" stroke="#F6F4EF" stroke-width="1.8" />
          </svg>
        </div>

        <div class="px-5 py-4 flex items-center justify-between">
          <h2 class="font-aves text-3xl sm:text-4xl leading-none">
            Aves del Mundo
          </h2>
          <span class="w-9 h-9 rounded-full bg-[#1D3B2A] text-white flex items-center justify-center text-sm font-medium group-hover:translate-x-0.5 transition shrink-0">
            →
          </span>
        </div>
      </a>

      <div id="card-pokemon" class="arena-poke rounded-xl overflow-hidden flex flex-col select-none">
        <div class="relative h-44 sm:h-52 w-full overflow-hidden bg-[#18181B]">
          <div class="half-split-left bg-[#EF4444] flex items-center justify-center p-3">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png"
                 alt="Charizard"
                 class="w-28 h-28 sm:w-36 sm:h-36 object-contain drop-shadow-[0_6px_6px_rgba(0,0,0,0.4)]" />
          </div>
          <div class="half-split-right bg-[#3B82F6] flex items-center justify-center p-3">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/9.png"
                 alt="Blastoise"
                 class="w-28 h-28 sm:w-36 sm:h-36 object-contain drop-shadow-[0_6px_6px_rgba(0,0,0,0.4)]" />
          </div>
          <svg class="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="none" viewBox="0 0 100 100">
            <line x1="55" y1="0" x2="44" y2="100" stroke="#111111" stroke-width="2.5" />
          </svg>
        </div>

        <div class="px-5 py-4 flex items-center justify-between border-t-[3px] border-current">
          <h2 class="font-poke font-extrabold text-2xl sm:text-3xl tracking-tight uppercase leading-none">
            Pokémon
          </h2>
          <span class="px-2.5 py-1 rounded bg-[#111111] text-[#FFDE59] dark:bg-[#FFDE59] dark:text-[#111111] font-poke text-[11px] font-bold uppercase tracking-wider">
            Pronto
          </span>
        </div>
      </div>

      <div id="card-flores" class="arena-flora rounded-2xl overflow-hidden flex flex-col select-none">
        <div class="relative h-44 sm:h-52 w-full bg-[#DDE5DD] overflow-hidden">
          <div class="half-split-left">
            <img src="https://inaturalist-open-data.s3.amazonaws.com/photos/40082393/medium.jpg"
                 alt="Mburucuyá"
                 class="w-full h-full object-cover object-center" />
          </div>
          <div class="half-split-right">
            <img src="https://inaturalist-open-data.s3.amazonaws.com/photos/127799924/medium.jpg"
                 alt="Orquídea"
                 class="w-full h-full object-cover object-center" />
          </div>
          <svg class="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="none" viewBox="0 0 100 100">
            <line x1="55" y1="0" x2="44" y2="100" stroke="#EFECE6" stroke-width="1.8" />
          </svg>
        </div>

        <div class="px-5 py-4 flex items-center justify-between">
          <h2 class="font-flora italic font-semibold text-3xl sm:text-4xl leading-none">
            Flores y Plantas
          </h2>
          <span class="px-2.5 py-1 rounded-full bg-black/10 dark:bg-white/10 text-[11px] font-medium">
            Pronto
          </span>
        </div>
      </div>

      <div id="card-mamiferos" class="arena-fauna rounded-2xl overflow-hidden flex flex-col select-none">
        <div class="relative h-44 sm:h-52 w-full bg-[#141210] overflow-hidden">
          <div class="half-split-left">
            <img src="https://static.inaturalist.org/photos/51015966/medium.jpg"
                 alt="Yaguareté"
                 class="w-full h-full object-cover object-center" />
          </div>
          <div class="half-split-right">
            <img src="https://inaturalist-open-data.s3.amazonaws.com/photos/43633891/medium.jpg"
                 alt="Tigre"
                 class="w-full h-full object-cover object-center" />
          </div>
          <svg class="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="none" viewBox="0 0 100 100">
            <line x1="55" y1="0" x2="44" y2="100" stroke="#8C6239" stroke-width="1.8" />
          </svg>
        </div>

        <div class="px-5 py-4 flex items-center justify-between">
          <h2 class="font-aves text-3xl sm:text-4xl leading-none tracking-wide">
            Mamíferos y Felinos
          </h2>
          <span class="px-2.5 py-1 rounded-full bg-black/20 dark:bg-white/10 text-[11px] font-medium border border-current/20">
            Pronto
          </span>
        </div>
      </div>

    </section>

  </main>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    const themeLabel = document.getElementById('themeLabel');
    const themeIconDark = document.getElementById('themeIconDark');
    const themeIconLight = document.getElementById('themeIconLight');

    function syncThemeUI() {
      const isDark = document.documentElement.classList.contains('dark');
      themeLabel.textContent = isDark ? 'Claro' : 'Oscuro';
      if (themeIconDark && themeIconLight) {
        themeIconDark.classList.toggle('hidden', isDark);
        themeIconLight.classList.toggle('hidden', !isDark);
      }
    }
    syncThemeUI();

    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('rankea2_theme', isDark ? 'dark' : 'light');
      syncThemeUI();
    });

    const ARENAS = [
      {
        id: 'aves',
        title: 'Aves del Mundo',
        href: '/aves/',
        active: true,
        thumb: 'https://inaturalist-open-data.s3.amazonaws.com/photos/63281117/medium.jpg',
        pillClass: 'bg-[#F6F4EF] text-[#161816] border-[#1D3B2A] dark:bg-[#151C17] dark:text-[#EDF3EE] dark:border-[#2D5A3F]',
        fontClass: 'font-aves text-2xl'
      },
      {
        id: 'pokemon',
        title: 'Pokémon',
        href: '#card-pokemon',
        active: false,
        thumb: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png',
        pillClass: 'bg-[#FFDE59] text-[#111111] border-[#111111] dark:bg-[#1F1D16] dark:text-[#FFDE59] dark:border-[#FFDE59]',
        fontClass: 'font-poke font-extrabold text-lg uppercase'
      },
      {
        id: 'flores',
        title: 'Flores y Plantas',
        href: '#card-flores',
        active: false,
        thumb: 'https://inaturalist-open-data.s3.amazonaws.com/photos/40082393/medium.jpg',
        pillClass: 'bg-[#EFECE6] text-[#2B332C] border-[#B7C4B8] dark:bg-[#151A16] dark:text-[#E2ECE3] dark:border-[#38473A]',
        fontClass: 'font-flora italic font-semibold text-2xl'
      },
      {
        id: 'mamiferos',
        title: 'Mamíferos y Felinos',
        href: '#card-mamiferos',
        active: false,
        thumb: 'https://static.inaturalist.org/photos/51015966/medium.jpg',
        pillClass: 'bg-[#1E1B18] text-[#F5EFE6] border-[#8C6239] dark:bg-[#1A1714] dark:text-[#F5EFE6] dark:border-[#A67848]',
        fontClass: 'font-aves text-2xl'
      }
    ];

    let pairIdx = 0;
    const PAIRS = [
      [0, 1],
      [0, 3],
      [0, 2],
      [1, 3]
    ];

    function renderQuickDuel() {
      const [iA, iB] = PAIRS[pairIdx % PAIRS.length];
      const a = ARENAS[iA];
      const b = ARENAS[iB];
      const box = document.getElementById('quickDuelContainer');

      const renderChoice = (item) => `
        <a href="${item.href}"
           class="flex items-center justify-between gap-3 px-3.5 py-2.5 rounded-xl border-2 ${item.pillClass} transition hover:scale-[1.01]">
          <div class="flex items-center gap-3 min-w-0">
            <img src="${item.thumb}" alt="${item.title}" class="w-10 h-10 rounded-lg object-cover bg-black/10 shrink-0" />
            <span class="${item.fontClass} truncate leading-none">${item.title}</span>
          </div>
          <span class="text-xs font-medium shrink-0 opacity-75">${item.active ? 'Jugar →' : 'Pronto'}</span>
        </a>
      `;

      box.innerHTML = `
        ${renderChoice(a)}
        <div class="flex items-center justify-center text-xs font-bold hub-muted px-1">VS</div>
        ${renderChoice(b)}
      `;
    }

    document.getElementById('shuffleMatchupBtn').addEventListener('click', () => {
      pairIdx++;
      renderQuickDuel();
    });

    renderQuickDuel();
  </script>

</body>
</html>
